name: Deploy grabmale.lionify.de

# Kein Staging: Jeder Push auf main geht direkt live.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      # Die Action speichert einen Sync-Stand (.ftp-deploy-sync-state.json)
      # auf dem Server und lädt danach nur geänderte Dateien hoch.
      - name: Per FTP hochladen (nur Änderungen)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            CLAUDE.md
            ANLEITUNG-ZUGANGSDATEN.md
            **/.DS_Store
            scripts/**
